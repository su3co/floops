[workspace]
members = ["crates/physics", "crates/server", "crates/python"]
default-members = ["crates/physics", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/su3co/floops"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = { version = "0.4", features = ["serde"] }
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1

