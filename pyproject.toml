[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "unnamed-su3-physics"
version = "0.1.0"
description = "Temporary-name Python bindings to the Rust particle simulation core"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "unnamed_physics"

